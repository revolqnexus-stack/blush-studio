<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#060504" />
    
    <!-- SEO -->
    <title>Blush Fine Makeup Art | Bridal Makeup Artist in Hyderabad</title>
    <meta name="description" content="Blush Fine Makeup Art creates elegant bridal, engagement and special occasion makeup looks in Hyderabad, with a focus on natural beauty, South Indian bridal artistry and camera-ready elegance." />
    <meta name="keywords" content="Bridal makeup artist Hyderabad, Blush Fine Makeup Art, Blush Studio Jubilee Hills, South Indian bridal makeup, Wedding makeup Hyderabad, Engagement makeup Telangana" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Blush Fine Makeup Art | Bridal Makeup Artist in Hyderabad" />
    <meta property="og:description" content="Blush Fine Makeup Art — elegant bridal, engagement and special occasion makeup in Jubilee Hills, Hyderabad. South Indian bridal artistry and camera-ready elegance." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/photos/hero.webp" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blush Fine Makeup Art | Bridal Makeup Artist in Hyderabad" />
    <meta name="twitter:description" content="Blush Fine Makeup Art — elegant bridal, engagement and special occasion makeup in Jubilee Hills, Hyderabad." />
    <meta name="twitter:image" content="/photos/hero.webp" />
    
    <!-- Performance: DNS Prefetch & Preconnect -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Performance: Preload Critical Resources -->
    <link rel="preload" as="image" href="/photos/hero.webp" fetchpriority="high">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&family=Pinyon+Script&display=swap">
    
    <!-- Fonts: Optimized for mobile - fewer weights -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&family=Pinyon+Script&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&family=Pinyon+Script&display=swap">
    </noscript>
    
    <!-- Critical CSS for mobile LCP -->
    <style>
      /* Prevent FOUC and layout shift */
      body:not(.loader-complete) main{opacity:0;visibility:hidden;pointer-events:none}
      body.loader-complete main{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .4s ease-out}
      
      /* Hero section critical styles */
      #hero{position:relative;overflow:hidden;min-height:100svh}
      #hero img,#hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
      
      /* Loader critical styles */
      .loader-bg{position:fixed;inset:0;z-index:9999;background:#060504;display:flex;align-items:center;justify-content:center}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
